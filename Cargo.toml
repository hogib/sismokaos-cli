[package]
name = "sismokaos-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustfft = "6.1"
rayon = "1.8"
csv = "1.3"
mseed = "0.7.1"
butterworth = "0.1.0"
time = "0.3.55"
mimalloc = "0.1.52"

[patch.crates-io]
libmseed-sys = { path = "vendor/libmseed-sys" }

[profile.release]
lto = "fat"            
codegen-units = 1      
panic = "abort"       
strip = true         
